<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AoC Gamers Resources</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 20px;
            background-color: #121212;
            color: #ffffff;
        }

        a {
            color: #62b4ff;
        }

        ul {
            list-style-type: none;
            padding-left: 20px;
        }

        li {
            margin: 7px 0;
        }

        .tree-root {
            padding-left: 0;
        }

        .tree-row {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            line-height: 1.5;
        }

        .folder > ul {
            display: none;
        }

        .folder.open > ul {
            display: block;
        }

        .folder-label {
            align-items: center;
            background: transparent;
            border: 0;
            color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            font: inherit;
            padding: 0;
            text-align: left;
        }

        .border {
            border-color: #444444 !important;
        }

        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 12px;
            margin-bottom: 18px;
        }

        .form-control {
            background-color: #111111;
            border-color: #555555;
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #111111;
            border-color: #62b4ff;
            color: #ffffff;
            box-shadow: none;
        }

        .icon {
            display: inline-block;
            margin-right: 8px;
            text-align: center;
            width: 22px;
        }

        .folder-toggle {
            display: inline-block;
            margin-right: 8px;
            text-align: center;
            width: 22px;
        }

        .folder.open > .tree-row .folder-toggle::before {
            content: "-";
        }

        .folder:not(.open) > .tree-row .folder-toggle::before {
            content: "+";
        }

        .file-meta {
            color: #b9b9b9;
            font-size: 0.9rem;
            margin-left: 8px;
        }

        .copy-btn,
        .download-btn {
            background: transparent;
            border: 1px solid #555555;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 8px;
            padding: 2px 8px;
        }

        .copy-btn:hover,
        .download-btn:hover {
            border-color: #62b4ff;
            color: #62b4ff;
        }

        .tree-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .status {
            color: #b9b9b9;
            margin-bottom: 10px;
        }

        @media (max-width: 640px) {
            body {
                margin: 10px;
            }

            .container {
                padding: 14px;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .file-meta,
            .copy-btn {
                display: block;
                margin-left: 32px;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="my-4">AoC Gamers Resources</h1>

        <div class="toolbar">
            <input id="search" class="form-control" type="search" placeholder="Buscar archivo">
            <select id="extension-filter" class="form-control">
                <option value="">Todas las extensiones</option>
            </select>
        </div>

        <div class="tree-actions">
            <button id="expand-all" class="copy-btn" type="button">Expandir todo</button>
            <button id="collapse-all" class="copy-btn" type="button">Contraer todo</button>
        </div>

        <div id="status" class="status">Cargando recursos...</div>
        <div id="file-tree" class="border p-3 mb-4"></div>

        <h2 class="my-4">Carpetas comprimidas</h2>
        <ul id="compressed-folders" class="border p-3"></ul>
    </main>

    <script>
        const state = {
            tree: {},
            compressedFiles: [],
            manifest: {},
            query: '',
            extension: ''
        };

        const fileTreeContainer = document.getElementById('file-tree');
        const compressedFoldersContainer = document.getElementById('compressed-folders');
        const searchInput = document.getElementById('search');
        const extensionFilter = document.getElementById('extension-filter');
        const expandAllButton = document.getElementById('expand-all');
        const collapseAllButton = document.getElementById('collapse-all');
        const status = document.getElementById('status');

        Promise.all([
            fetchJson('filetree/file-tree.json'),
            fetchJson('filetree/compressed-files.json'),
            fetchJson('filetree/manifest.json')
        ])
            .then(([tree, compressedFiles, manifest]) => {
                state.tree = tree;
                state.compressedFiles = compressedFiles;
                state.manifest = manifest;
                populateExtensionFilter(manifest);
                render();
            })
            .catch(error => {
                status.textContent = `No se pudieron cargar los recursos: ${error.message}`;
            });

        searchInput.addEventListener('input', event => {
            state.query = event.target.value.trim().toLowerCase();
            render();
        });

        extensionFilter.addEventListener('change', event => {
            state.extension = event.target.value;
            render();
        });

        expandAllButton.addEventListener('click', () => {
            fileTreeContainer.querySelectorAll('.folder').forEach(folder => folder.classList.add('open'));
        });

        collapseAllButton.addEventListener('click', () => {
            fileTreeContainer.querySelectorAll('.folder').forEach(folder => folder.classList.remove('open'));
        });

        function fetchJson(url) {
            return fetch(url).then(response => {
                if (!response.ok) {
                    throw new Error(`${url} respondio ${response.status}`);
                }

                return response.json();
            });
        }

        function populateExtensionFilter(manifest) {
            const extensions = [...new Set(Object.keys(manifest)
                .map(filePath => filePath.match(/\.([^.\/]+)$/))
                .filter(Boolean)
                .map(match => match[1].toLowerCase()))]
                .sort((a, b) => a.localeCompare(b));

            for (const extension of extensions) {
                const option = document.createElement('option');
                option.value = extension;
                option.textContent = `.${extension}`;
                extensionFilter.appendChild(option);
            }
        }

        function render() {
            fileTreeContainer.textContent = '';
            compressedFoldersContainer.textContent = '';

            const result = createFileTree(state.tree);
            fileTreeContainer.appendChild(result.element);

            status.textContent = `${result.count} archivo${result.count === 1 ? '' : 's'} disponible${result.count === 1 ? '' : 's'}`;
            renderCompressedFiles();
        }

        function createFileTree(tree, parentPath = '') {
            const ul = document.createElement('ul');
            if (!parentPath) {
                ul.classList.add('tree-root');
            }

            let count = 0;

            for (const key in tree) {
                const filePath = parentPath ? `${parentPath}/${key}` : key;
                const value = tree[key];

                if (value) {
                    const child = createFileTree(value, filePath);
                    if (child.count === 0) continue;

                    const li = document.createElement('li');
                    li.classList.add('folder');

                    const row = document.createElement('div');
                    row.classList.add('tree-row');

                    const icon = document.createElement('span');
                    icon.classList.add('folder-toggle');

                    const label = document.createElement('button');
                    label.type = 'button';
                    label.classList.add('folder-label');
                    label.textContent = key;
                    label.onclick = () => li.classList.toggle('open');

                    row.appendChild(icon);
                    row.appendChild(label);
                    li.appendChild(row);
                    li.appendChild(child.element);
                    ul.appendChild(li);
                    count += child.count;
                    continue;
                }

                if (!matchesFilters(filePath)) continue;

                const li = document.createElement('li');
                const row = document.createElement('div');
                row.classList.add('tree-row');

                const icon = document.createElement('span');
                icon.classList.add('icon');
                icon.textContent = '-';

                const fileLink = document.createElement('a');
                fileLink.href = filePath;
                fileLink.textContent = key;

                if (key.endsWith('.html') || key.match(/\.(jpg|jpeg|png|gif|bmp|svg)$/i)) {
                    fileLink.target = '_blank';
                    fileLink.rel = 'noopener';
                }

                row.appendChild(icon);
                row.appendChild(fileLink);
                row.appendChild(createMetadata(filePath));
                row.appendChild(createCopyButton(filePath));
                li.appendChild(row);
                ul.appendChild(li);
                count += 1;
            }

            return { element: ul, count };
        }

        function matchesFilters(filePath) {
            const normalizedPath = filePath.toLowerCase();

            if (state.query && !normalizedPath.includes(state.query)) {
                return false;
            }

            if (state.extension && !normalizedPath.endsWith(`.${state.extension}`)) {
                return false;
            }

            return true;
        }

        function createMetadata(filePath) {
            const metadata = state.manifest[filePath];
            const span = document.createElement('span');
            span.classList.add('file-meta');

            if (!metadata) {
                span.textContent = '';
                return span;
            }

            span.textContent = `${formatBytes(metadata.size)} sha256:${metadata.sha256.slice(0, 12)}`;
            return span;
        }

        function createCopyButton(filePath) {
            const button = document.createElement('button');
            button.type = 'button';
            button.classList.add('copy-btn');
            button.textContent = 'Copiar URL';
            button.onclick = () => copyUrl(filePath, button);
            return button;
        }

        function renderCompressedFiles() {
            for (const file of state.compressedFiles) {
                const li = document.createElement('li');
                const icon = document.createElement('span');
                icon.classList.add('icon');
                icon.textContent = 'ZIP';

                const downloadLink = document.createElement('a');
                downloadLink.href = file;
                downloadLink.download = file;
                downloadLink.textContent = file;

                const metadata = createMetadata(file);
                const copyButton = createCopyButton(file);

                const downloadButton = document.createElement('button');
                downloadButton.type = 'button';
                downloadButton.textContent = 'Descargar';
                downloadButton.classList.add('download-btn');
                downloadButton.onclick = () => downloadLink.click();

                li.appendChild(icon);
                li.appendChild(downloadLink);
                li.appendChild(metadata);
                li.appendChild(downloadButton);
                li.appendChild(copyButton);
                compressedFoldersContainer.appendChild(li);
            }
        }

        function copyUrl(filePath, button) {
            const url = new URL(filePath, window.location.href).href;

            navigator.clipboard.writeText(url)
                .then(() => {
                    button.textContent = 'Copiado';
                    setTimeout(() => {
                        button.textContent = 'Copiar URL';
                    }, 1200);
                })
                .catch(() => {
                    window.prompt('Copia la URL', url);
                });
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';

            const units = ['B', 'KB', 'MB', 'GB'];
            const size = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            const value = bytes / (1024 ** size);

            return `${value.toFixed(value >= 10 || size === 0 ? 0 : 1)} ${units[size]}`;
        }
    </script>
</body>
</html>
