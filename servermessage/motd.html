<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>MOTD AoC</title>
  </head>
  <body style="margin:0; padding:0; background:#000; overflow-y: hidden;">
    <img id="servermessage-image" alt="MOTD" src="/servermessage/img/motd/classic01.png" style="width:100%;height:100%;">
    <script>
      const allowedImages = {
      "default": "/servermessage/img/motd/classic01.png",
      "classic01": "/servermessage/img/motd/classic01.png",
      "classic02": "/servermessage/img/motd/classic02.png",
      "gpt01": "/servermessage/img/motd/gpt01.png",
      "patas01": "/servermessage/img/motd/patas01.jpg",
      "patas02": "/servermessage/img/motd/patas02.jpg",
      "patas03": "/servermessage/img/motd/patas03.png",
      "patas04": "/servermessage/img/motd/patas04.png",
      "patasvip01": "/servermessage/img/motd/patasvip01.jpg"
};
      const params = new URLSearchParams(window.location.search);
      const requestedImage = params.get('img');
      const requestedSource = params.get('src');
      const image = document.getElementById('servermessage-image');
      const allowedSources = new Set(Object.values(allowedImages));

      if (requestedImage && allowedImages[requestedImage]) {
        image.src = allowedImages[requestedImage];
      } else if (requestedSource && allowedSources.has(requestedSource)) {
        image.src = requestedSource;
      }
    </script>

  </body>
</html>
